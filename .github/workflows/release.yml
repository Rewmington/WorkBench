name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 手动触发是干跑：只产出 workflow artifact，不建 Release（publish 那步会跳过）。
  TAG: ${{ github.event_name == 'push' && github.ref_name || 'manual' }}

jobs:
  desktop:
    name: Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run tauri:build

      - name: 收拢安装包
        shell: bash
        run: |
          mkdir -p dist
          src=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n 1)
          cp "$src" "dist/Anvil-${TAG}-x64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: 取依赖
        working-directory: mobile
        run: flutter pub get

      - name: 分析
        working-directory: mobile
        run: flutter analyze

      - name: 测试
        working-directory: mobile
        run: flutter test

      - name: 还原发布签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p mobile/.signing
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/.signing/anvil-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../.signing/anvil-release.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
              > mobile/android/key.properties
          else
            echo "没有签名 secrets，回退 debug 证书"
          fi

      - name: 打 APK
        working-directory: mobile
        run: flutter build apk --release

      - name: 收拢 APK
        run: |
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "dist/Anvil-${TAG}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 建 Release
    # 只有推 tag 才发布；手动触发是干跑，不产出公开 release。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Anvil ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
